language = "C"
header = """/*
 * zimru — independent Rust re-implementation of the ZIM file format.
 *
 * This header is auto-generated by cbindgen from src/cffi/. Do not edit by
 * hand. Regenerate with: cargo build --release --features cffi
 *
 * Strings: returned `const char*` are NUL-terminated and remain valid until
 *   the parent handle (Entry, Item, Archive) is freed. Caller copies if a
 *   longer lifetime is needed.
 * Bytes:   returned via pointer + length; not NUL-terminated. Lifetime tied
 *   to the parent handle.
 * Errors:  fallible functions take a `zimru_error_t** err` out-parameter.
 *   On success *err is left untouched. On failure the function returns NULL
 *   (or 0/false) AND sets *err to a heap-allocated error the caller frees
 *   with zimru_error_free.
 * Ownership: anything returned via `*_t*` is owned by the caller and must
 *   be freed with the matching `*_free` function.
 */
"""
include_guard = "ZIMRU_H"
pragma_once = true
include_version = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
cpp_compat = true
documentation = true

[export]
prefix = ""
include = ["zimru_error_code_t"]

[enum]
prefix_with_name = true

[parse]
parse_deps = false

[fn]
prefix = ""
