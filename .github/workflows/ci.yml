name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: Build + test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build
        run: cargo build --release --all-targets
      - name: cargo test
        run: cargo test --release

  reader-only:
    name: Reader-only build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build (reader-only)
        run: cargo build --release --no-default-features
      - name: confirm writer binaries are NOT produced
        run: |
          test ! -f target/release/zimrecreate || (echo "writer binary leaked into reader-only build" && exit 1)
          test ! -f target/release/zimwriterfs || (echo "writer binary leaked into reader-only build" && exit 1)
      - name: cargo test (reader-only)
        run: cargo test --release --no-default-features --lib --tests

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy (all targets, all features)
        run: cargo clippy --release --all-targets --all-features -- -D warnings

  docs:
    name: Rustdoc (broken links are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc (all features, private items)
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  cffi:
    name: C ABI build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build (cffi feature)
        run: cargo build --release --features cffi
      - name: confirm libzimru.so produced
        run: test -f target/release/libzimru.so
      - name: confirm include/zimru.h regenerated
        run: test -f include/zimru.h
      - name: cargo test (cffi smoke)
        run: cargo test --release --features cffi --test cffi_smoke --test cffi_writer_smoke

  real-archives:
    name: Real-archive fixtures (pinned kiwix downloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: download pinned fixtures
        run: |
          mkdir -p zim-cache
          base=https://download.kiwix.org/zim/wikipedia
          curl --fail --location --retry 3 --silent --show-error \
            --output zim-cache/wikipedia_en_ray-charles_mini.zim "$base/wikipedia_en_ray-charles_mini_2026-08.zim"
          curl --fail --location --retry 3 --silent --show-error \
            --output zim-cache/wikipedia_en_ray-charles_nopic.zim "$base/wikipedia_en_ray-charles_nopic_2026-08.zim"
          curl --fail --location --retry 3 --silent --show-error \
            --output zim-cache/wikipedia_zh_chemistry_mini.zim "$base/wikipedia_zh_chemistry_mini_2026-09.zim"
          sha256sum --check <<'EOF'
          9aa68a83cf9a7d9449724b6c722f797e2a307e290a34b083df717028cd42330d  zim-cache/wikipedia_en_ray-charles_mini.zim
          59eb2b233b1fcdd7dfd44679a519501dbd7b77fbee80ac46ad90a57899459e62  zim-cache/wikipedia_en_ray-charles_nopic.zim
          212bf3f09e3fa4c02886d8a2147f4a58682a7111d28645e6e1d084cc1a3fe620  zim-cache/wikipedia_zh_chemistry_mini.zim
          EOF
      - name: cargo test (real archives, fixtures required)
        run: cargo test --release --test real_files -- --nocapture
        env:
          ZIMRU_REQUIRE_FIXTURES: "1"
